<html>
    <head>
        <link rel="stylesheet" href="index.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
          <div class="scores">
            <div class="home-column">
                <h3 id="h2-home">🍀BOS</h3>
                <h2 id="home-score">0</h2>
                <div>
                    <button onclick="homeapoint()">+ 1</button>
                    <button onclick="hometwopoints()">+ 2</button>
                    <button onclick="homethreepoints()">+ 3</button>
                </div> 
            </div>     
            <div class="guest-column">
                <h3 id="h2-guest">🐴DAL</h3>
                <h2 id="guest-score">0</h2>
                <div>
                    <button onclick="guestapoint()">+ 1</button>
                    <button onclick="guesttwopoints()">+ 2</button>
                    <button onclick="guestthreepoints()">+ 3</button>
                </div>
            </div>
          </div>
          <button id="reset" onclick="reset()">Reset</button>
        </div>        
        <script src="index.js"></script>
    </body>
</html>
